# バージョンは 2026-08-12 に crates.io で確認(docs/sdk-notes.md 参照)
[package]
name = "agent-deck"
version = "0.4.0"
description = "Copilot エージェントに定型業務を依頼し、稼働状況をリアルタイム表示するデスクトップアプリ"
edition = "2021"
# 検証バイナリ(smoke / stepN_check)があるため、tauri dev の cargo run 対象を明示
default-run = "agent-deck"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# フォルダ選択ダイアログ用(docs/requirements.md §3.4)。2.7.2 は 2026-08-12 に crates.io で確認
# した最新版(docs/sdk-notes.md 参照)。禁止リストの例外として明示的に許可されているクレート。
tauri-plugin-dialog = "2"
# シリアライズ(設定ファイル・IPC・イベントすべてで使用)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# docs/architecture.md §1.2 により bundled-cli は無効化。
# 1.0.9 は 2026-08-12 に crates.io で確認した最新安定版(docs/sdk-notes.md 参照)
github-copilot-sdk = { version = "1.0.9", default-features = false }
# smoke バイナリの #[tokio::main] 用。SDK が非同期 API(io/sync/process/net)を要求するため tokio ランタイムが必要。
# sync/time は copilot.rs の中断用 oneshot チャネルと send_and_wait 後のイベントドレインで使用
# (github-copilot-sdk 自体も同機能を要求するため実質的には既に有効だったが、明示しておく)
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
# v0.2 共有エージェント定義の同期用(docs/roadmap.md v0.2)。定義バージョンの表示(sha256 先頭8桁)と
# 更新ファイルの検証(v0.3 で使う想定)に必須。RustCrypto の標準実装で、非公式 Copilot 連携ではない
# ため §1.1 の禁止対象外。10.10 は 2026-08-12 に crates.io で確認した最新版。
sha2 = "0.10"
# v0.4 定期実行(docs/roadmap.md v0.4)。スケジュールの次回発火計算にローカル時刻のカレンダー演算
# (曜日・月末丸め)が必要で std には無い。日付演算の自前実装は月末・閏年のバグ源になるため
# 標準実装を使う。
chrono = { version = "0.4", features = ["clock"] }
# v0.4 完了・失敗の Windows トースト通知(docs/roadmap.md v0.4)。公式 Tauri プラグイン。
tauri-plugin-notification = "2"
